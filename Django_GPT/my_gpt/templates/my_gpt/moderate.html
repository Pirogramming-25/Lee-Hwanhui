{% extends "my_gpt/base.html" %}
{% load static %}

{% block title %}유해 표현 분석 - Django GPT{% endblock %}

{% block content %}
<section class="feature-page">
    <h2>🚨 유해 표현 분석</h2>

    <dl class="model-info">
        <dt>사용 모델</dt>
        <dd>unitary/toxic-bert</dd>
        <dt>입력 언어</dt>
        <dd>영어</dd>
    </dl>

    <form id="moderate-form" class="run-form">
        <label for="moderate-input" class="sr-only">분석할 문장</label>
        <textarea
        id="moderate-input"
        maxlength="1000"
        rows="4"
        placeholder="영어 문장을 입력하세요 (1~1000자)"></textarea>

        <button type="submit" id="moderate-run-btn">유해 표현 분석 실행</button>
    </form>

    <p id="moderate-loading" class="loading-text" hidden>처리 중...</p>

    <div id="moderate-error" class="error-box" hidden></div>

    <div id="moderate-result" class="result-box" hidden>
        <p>최고 위험 레이블: <strong id="moderate-highest-label"></strong></p>
        <p>위험 점수: <strong id="moderate-highest-score"></strong></p>
        <ul id="moderate-all-scores"></ul>
    </div>

    <div class="history-box">
        <h3>최근 실행 기록</h3>
        <ul id="moderate-history-list"></ul>
    </div>
    </section>

{{ recent_histories|json_script:"moderate-initial-history" }}

<script src="{% static 'my_gpt/js/common.js' %}"></script>
<script src="{% static 'my_gpt/js/moderate.js' %}"></script>
{% endblock %}
