{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django GPT{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'my_gpt/css/style.css' %}">
</head>
<body>

    <header>
        <h1 class="site-title">Django GPT</h1>

        <nav class="tab-bar">
        <a href="{% url 'my_gpt:sentiment' %}"
            class="nav-link {% if request.resolver_match.url_name == 'sentiment' %}active{% endif %}">
            감정 분석
        </a>
        <a href="{% url 'my_gpt:summarize' %}"
            class="nav-link {% if request.resolver_match.url_name == 'summarize' %}active{% endif %}">
            문서 요약
        </a>
        <a href="{% url 'my_gpt:moderate' %}"
            class="nav-link {% if request.resolver_match.url_name == 'moderate' %}active{% endif %}">
            유해 표현 분석
        </a>
        <a href="{% url 'my_gpt:combo' %}"
            class="nav-link {% if request.resolver_match.url_name == 'combo' %}active{% endif %}">
            복합 분석
        </a>
        </nav>

        <div class="auth-status">
        {% if user.is_authenticated %}
            <span>{{ user.username }}님</span>
            <form method="post" action="{% url 'logout' %}" class="inline-form">
            {% csrf_token %}
            <button type="submit" class="link-button">로그아웃</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">로그인</a>
        {% endif %}
        </div>
    </header>

    <main class="page-content">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
