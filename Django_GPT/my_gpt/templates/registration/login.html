<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 - Django GPT</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'my_gpt/css/style.css' %}">
</head>
<body>

    {% if request.GET.required == "1" %}
        <script>
        alert("로그인 후 이용해주세요");
        </script>
    {% endif %}

    <main class="login-wrap">
        <h1>로그인</h1>

        {% if form.errors %}
        <p class="error-text">아이디 또는 비밀번호가 올바르지 않습니다.</p>
        {% endif %}

        <form method="post">
        {% csrf_token %}

        <label for="id_username">아이디</label>
        {{ form.username }}

        <label for="id_password">비밀번호</label>
        {{ form.password }}

        <input type="hidden" name="next" value="{{ next }}">

        <button type="submit">로그인</button>
        </form>
    </main>

</body>
</html>
