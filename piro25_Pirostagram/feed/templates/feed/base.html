<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Pirostagram</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            margin: 0;
            font-family: sans-serif;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 34px;
            width: 400px;
            height: 100vh;
            padding: 30px 35px;
            background: #FAFAFA;
            box-shadow: 0 4px 4px 0 rgba(0, 0, 0, 0.25);
            box-sizing: border-box;
            position: fixed;
        }

        .logo {
            align-self: stretch;
            color: #01A404;
            font-size: 48px;
            font-weight: 700;
            line-height: normal;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: 48px;
            width: 212px;
            color: #222;
            text-decoration: none;
            font-size: 15px;
        }

        .search-box input {
            width: 130px;
            padding: 5px 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
        }

        .search-box button {
            padding: 5px 8px;
            border: none;
            border-radius: 6px;
            background: #eee;
            cursor: pointer;
            font-size: 13px;
        }

        .main-content {
            margin-left: 400px;
            padding: 30px;
            width: 100%;
            box-sizing: border-box;
        }

        .story-bar {
            max-width: 940px;
            width: 100%;
            height: 154px;
            border-radius: 5px;
            background: #FAFAFA;
            box-shadow: 0 0 4px 0 rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .story-circle {
            width: 100px;
            height: 100px;
            border-radius: 100px;
            opacity: 0.8;
            background: #D9D9D9;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            text-decoration: none;
        }

        .story-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 100px;
        }

        .plus-icon {
            font-size: 56px;
            line-height: 56px;
            color: #313131;
        }

        .post-card {
            max-width: 940px;
            width: 100%;
            min-height: 1240px;
            border-radius: 5px;
            background: #FAFAFA;
            box-shadow: 0 0 4px 0 rgba(0, 0, 0, 0.25);
            padding: 20px;
            box-sizing: border-box;
            margin-bottom: 30px;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .username, .post-content {
            color: #000;
            font-family: 'Inter', sans-serif;
            font-size: 35px;
            font-weight: 400;
            line-height: normal;
            text-decoration: none;
        }

        .post-image {
            max-width: 940px;
            width: 100%;
            height: 598px;
            background: #D9D9D9;
            overflow: hidden;
        }
        .post-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .like-btn {
            width: 93px;
            height: 64px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            background: #D9D9D9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .like-btn.liked {
            background: #01A404;
        }
        .like-btn svg {
            width: 28px;
            height: 24px;
            stroke-width: 3px;
            stroke: #313131;
            fill: none;
        }
        .like-btn.liked svg {
            stroke: #F3E3E3;
            fill: #F3E3E3;
        }

        .comment-card {
            max-width: 902px;
            width: 100%;
            min-height: 102px;
            border-radius: 10px;
            background: #E9E9E9;
            padding: 10px 20px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        .comment-username {
            color: #000;
            font-family: 'Inter', sans-serif;
            font-size: 30px;
            font-weight: 400;
            margin: 0;
        }
        .comment-content {
            color: #000;
            font-family: 'Inter', sans-serif;
            font-size: 20px;
            font-weight: 400;
            margin: 5px 0 0;
        }

        .comment-input-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .comment-input {
            width: 766px;
            height: 64px;
            border-radius: 10px;
            border: 1.5px solid #E8E8E8;
            background: #FFF;
            box-shadow: 0 0 4px 0 rgba(0, 0, 0, 0.25);
            box-sizing: border-box;
            padding: 0 15px;
            font-size: 18px;
        }
        .comment-submit {
            width: 118px;
            height: 64px;
            border-radius: 10px;
            border: 1.5px solid #E8E8E8;
            background: #01A404;
            box-shadow: 0 0 4px 0 rgba(0, 0, 0, 0.25);
            color: #FFF;
            font-family: 'Inter', sans-serif;
            font-size: 30px;
            font-weight: 400;
            cursor: pointer;
        }

        .search-result-title {
            color: #000;
            font-family: 'Inter', sans-serif;
            font-size: 40px;
            font-weight: 500;
            line-height: normal;
            margin-bottom: 20px;
        }

        .user-card {
            max-width: 940px;
            width: 100%;
            height: 154px;
            background: #FAFAFA;
            box-shadow: 0 0 4px 0 rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .user-card-left {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .user-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #D9D9D9;
            opacity: 0.8;
            overflow: hidden;
            flex-shrink: 0;
        }
        .user-avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-id {
            color: #01A404;
            font-family: 'Inter', sans-serif;
            font-size: 40px;
            font-weight: 500;
            line-height: normal;
            text-decoration: none;
        }

        .user-actions {
            display: flex;
            gap: 10px;
        }

        .user-btn {
            display: flex;
            width: 207px;
            height: 62px;
            padding: 13px 30px 13px 31px;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border-radius: 10px;
            background: #D9D9D9;
            color: #01A404;
            font-family: 'Inter', sans-serif;
            font-size: 26px;
            font-weight: 500;
            line-height: normal;
            border: none;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
        }
        .user-btn.following {
            background: #01A404;
            color: #FFF;
        }

        .story-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        }

        .story-modal {
        position: relative;
        width: 877px;
        max-width: 90vw;
        height: 917px;
        max-height: 90vh;
        background: #FAFAFA;
        box-shadow: 0 0 4px 0 rgba(0, 0, 0, 0.25);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
        overflow-y: auto;
        }

        .story-photo-box {
        width: 668px;
        max-width: 100%;
        height: 719px;
        max-height: 70vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eee;
        }
        .story-photo-box img {
        width: 100%;
        object-fit: cover;
        }

        .story-close {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 56px;
        height: 56px;
        font-size: 56px;
        line-height: 56px;
        color: #000;
        transform: rotate(-45deg);
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        }

        .story-nav {
        position: absolute; 
        top: 50%;
        transform: translateY(-50%);
        z-index: 5;
        text-decoration: none;
        }
        .story-nav svg {
        width: 38.546px;
        height: 66.175px;
        stroke: #000;
        }
        .story-prev { left: 10px; }  
        .story-next { right: 10px; }  

        .profile-card {
        max-width: 940px;
        width: 100%;
        background: #FAFAFA;
        box-shadow: 0 0 4px 0 rgba(0, 0, 0, 0.25);
        padding: 40px;
        box-sizing: border-box;
        display: flex;
        gap: 40px;
        align-items: flex-start;
        margin-bottom: 30px;
        }

        /* 프로필 사진 테두리 원 */
        .profile-avatar-ring {
        width: 250px;
        height: 250px;
        border-radius: 50%;
        border: 2.5px solid #CFCFCF;
        background: #FAFAFA;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        }

        .profile-avatar {
        width: 238px;
        height: 238px;
        border-radius: 50%;
        background: #D9D9D9;
        overflow: hidden;
        }
        .profile-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        }

        .profile-info {
        display: flex;
        flex-direction: column;
        gap: 20px;
        }

        .profile-top-row {
        display: flex;
        align-items: center;
        gap: 25px;
        }

        .profile-username {
        color: #000;
        font-family: 'Inter', sans-serif;
        font-size: 40px;
        font-weight: 500;
        line-height: normal;
        }

        .profile-stats {
        color: #000;
        font-family: 'Inter', sans-serif;
        font-size: 30px;
        font-weight: 400;
        line-height: normal;
        display: flex;
        gap: 30px;
        }
        .profile-stats strong {
        font-weight: 500;
        }

        .profile-bio {
        color: #000;
        font-family: 'Inter', sans-serif;
        font-size: 30px;
        font-weight: 400;
        line-height: normal;
        margin: 0;
        }

        .profile-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 259px;
        height: 56px;
        border-radius: 10px;
        background: #D9D9D9;
        color: #01A404;
        font-family: 'Inter', sans-serif;
        font-size: 30px;
        font-weight: 500;
        line-height: normal;
        border: none;
        text-decoration: none;
        cursor: pointer;
        box-sizing: border-box;
        }
        .profile-btn.active {
        background: #01A404;
        color: #FAFAFA;
        }

        .profile-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        max-width: 940px;
        }
        .profile-grid img {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        background: #D9D9D9;
        }

        .form-card {
        max-width: 940px;
        width: 100%;
        background: #FFF;
        padding: 30px 40px;
        box-sizing: border-box;
        }

        .form-header {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 25px;
        }
        .form-header h2 {
        font-family: 'Inter', sans-serif;
        font-size: 35px;
        font-weight: 500;
        color: #000;
        margin: 0;
        }

        .form-submit-btn {
        background: #01A404;
        color: #FFF;
        font-family: 'Inter', sans-serif;
        font-size: 20px;
        font-weight: 500;
        border: none;
        border-radius: 8px;
        padding: 10px 25px;
        cursor: pointer;
        }

        .form-label {
        font-family: 'Inter', sans-serif;
        font-size: 20px;
        font-weight: 500;
        color: #000;
        display: block;
        margin-bottom: 10px;
        }

        .form-upload-box {
        width: 100%;
        min-height: 130px;
        border: 1px solid #E0E0E0;
        border-radius: 8px;
        background: #FAFAFA;
        margin-bottom: 25px;
        padding: 15px;
        box-sizing: border-box;
        }

        .form-textarea-box {
        width: 100%;
        border: 1px solid #E0E0E0;
        border-radius: 8px;
        background: #FAFAFA;
        padding: 5px 15px;
        box-sizing: border-box;
        }
        .form-textarea-box textarea {
        width: 100%;
        min-height: 100px;
        border: none;
        background: transparent;
        font-family: 'Inter', sans-serif;
        font-size: 18px;
        resize: vertical;
        outline: none;
        box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">Priostagram</div>

        <div class="nav-item">
            <a href="{% url 'feed:post_list' %}">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                <span>홈</span>
            </a>
        </div>

        {% if user.is_authenticated %}
        <div class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
            <span>게시글 검색</span>
            <form action="{% url 'feed:post_search' %}" method="get" class="search-box">
                <input type="text" name="q" placeholder="검색">
                <button type="submit">검색</button>
            </form>
        </div>

        <div class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
            <span>유저 검색</span>
            <form action="{% url 'feed:user_search' %}" method="get" class="search-box">
                <input type="text" name="q" placeholder="검색">
                <button type="submit">검색</button>
            </form>
        </div>

        <div class="nav-item">
            <a href="{% url 'feed:post_create' %}">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
                <span>게시글 만들기</span>
            </a>
        </div>

        <div class="nav-item">
            <a href="{% url 'feed:profile_view' username=user.username %}">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>프로필</span>
            </a>
        </div>
        {% else %}
        <div class="nav-item"><a href="{% url 'feed:login' %}"><span>🔑</span><span>로그인</span></a></div>
        {% endif %}
    </div>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
